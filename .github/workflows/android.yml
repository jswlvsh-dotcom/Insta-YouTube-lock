name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the APK as the 'android-latest' GitHub release (direct download link)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so updates install over the old version.
      # Add repository secrets GOWORK_KEYSTORE_BASE64, GOWORK_KEYSTORE_PASSWORD,
      # GOWORK_KEY_ALIAS and GOWORK_KEY_PASSWORD. Without them the debug key is used.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GOWORK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gowork.jks"
            echo "GOWORK_KEYSTORE_FILE=$RUNNER_TEMP/gowork.jks" >> "$GITHUB_ENV"
            echo "Signing with the GoWork release key."
          else
            echo "No GOWORK_KEYSTORE_BASE64 secret: signing with a temporary debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build APK
        env:
          GOWORK_KEYSTORE_PASSWORD: ${{ secrets.GOWORK_KEYSTORE_PASSWORD }}
          GOWORK_KEY_ALIAS: ${{ secrets.GOWORK_KEY_ALIAS }}
          GOWORK_KEY_PASSWORD: ${{ secrets.GOWORK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "GoWork-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GoWork-android
          path: android/GoWork-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish download link
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoWork-android

      - name: Update the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp GoWork-*.apk GoWork.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest GoWork.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "GoWork for Android (latest build)" \
            --notes "Install on your phone: download GoWork.apk, open it, allow 'Install unknown apps', then follow the setup in the app. Built from ${{ github.sha }}."
